name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "phase-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages site: the newest push wins and superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 26

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
