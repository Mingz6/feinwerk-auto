name: CI

# Every push and pull request runs every gate. main and phase-* pushes run the same gates
# through deploy.yml (workflow_call), so a deploy only happens when they all pass.
on:
  push:
    branches-ignore: [main, "phase-*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npx astro build
      - name: Demo-safety checks over dist
        run: npm run test:dist
      - name: HTML validation
        run: npm run validate:html
      - name: Link check
        run: npm run check:links
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright end to end
        run: npm run test:e2e
      - name: Screenshots (48 baselines)
        run: npm run test:visual
      - name: Accessibility (axe)
        run: npm run test:axe
      - name: Lighthouse CI
        run: npm run lhci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
